name: Auto-clockout poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-clockout
        run: |
          curl -sf -X GET https://www.krutotastes.com/api/cron/auto-clockout \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
