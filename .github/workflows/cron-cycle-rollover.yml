name: Cron - cycle rollover

on:
  schedule:
    - cron: '0 6 1,16 * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cycle-rollover
        run: |
          curl -sf -X GET https://www.krutotastes.com/api/cron/cycle-rollover \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
