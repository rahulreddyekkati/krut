name: Cron - late clock-in alert

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger late-clockin-alert
        run: |
          curl -sf -X GET https://www.krutotastes.com/api/cron/late-clockin-alert \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
