name: Cron - recap reminder

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recap-reminder
        run: |
          curl -sf -X GET https://www.krutotastes.com/api/cron/recap-reminder \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
