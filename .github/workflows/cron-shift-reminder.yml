name: Cron - shift reminder

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger shift-reminder
        run: |
          curl -sf -X GET https://www.krutotastes.com/api/cron/shift-reminder \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
